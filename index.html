<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kerstboom</title>
<meta name="theme-color" content="#0e1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kerstboom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="is-dark">
<div id="app">
  <div id="sky" aria-hidden="true"><div class="moon-sky"></div></div>
  <svg id="scenery" aria-hidden="true" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"></svg>
  <canvas id="snow" aria-hidden="true"></canvas>
  <svg id="topLights" aria-hidden="true"></svg>

  <main id="stage">
    <div id="cam"><svg id="treeBack" viewBox="0 0 400 620" aria-hidden="true"></svg><svg id="tree" viewBox="0 0 400 620" aria-hidden="true"></svg><canvas id="treeLights" aria-hidden="true"></canvas><div id="starFx" aria-hidden="true"></div><svg id="treeFx" viewBox="0 0 400 620" role="img" aria-label="Kerstboom met het pad van vandaag"></svg></div>
  </main>

  <canvas id="snowFront" aria-hidden="true"></canvas>

  <div id="toggleWrap">
    <svg class="hat" viewBox="0 0 64 44" aria-hidden="true">
      <path d="M6 34 C14 10 34 2 52 10 C46 16 44 24 46 32 Z" fill="#c8373d"/>
      <circle cx="54" cy="10" r="6" fill="#f8f3ea"/>
      <rect x="2" y="30" width="48" height="11" rx="5.5" fill="#f8f3ea"/>
    </svg>
    <button id="toggle" type="button">
      <span class="tg-label"></span>
      <span class="tg-switch"><i></i></span>
    </button>
  </div>

  <nav id="dock">
    <button type="button" data-open="proef">
      <svg viewBox="0 0 24 24"><path d="M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Proeflijst</span>
    </button>
  </nav>

  <div id="scrim"></div>
  <section id="sheet" role="dialog" aria-modal="true">
    <canvas id="drift" aria-hidden="true"></canvas>
    <div class="sh-grip"></div>
    <button class="sh-close" type="button" aria-label="Sluiten">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="sh-body" id="sheetBody"></div>
  </section>

  <section id="page" aria-live="polite"></section>

  <div id="toast" role="status"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
